name: TCT Range Scanner

on:
  schedule:
    - cron: "30 */2 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restaurar estado previo
        uses: actions/cache/restore@v4
        with:
          path: range_state.json
          key: range-never-matches
          restore-keys: |
            range-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Correr range scanner
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python range_scanner.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: range_state.json
          key: range-state-${{ github.run_id }}-${{ github.run_attempt }}
